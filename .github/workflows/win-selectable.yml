name: Windows Selectable Target

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        type: choice
        default: x64
        options:
          - x64
          - x86
          - arm64
          - x64_qt6
          - x64_ninja
          - x64_qt6_ninja
          - x86_ninja
          - arm64_ninja
          - all
      upload_artifact:
        description: "Upload the built executables"
        required: true
        type: boolean
        default: true

  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'kotatogram_changes.txt'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'

  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'kotatogram_changes.txt'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'

jobs:
  matrix-prep:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Matrix JSON
        id: set-matrix
        shell: bash
        run: |
          ALL_TARGETS='[
            {"target":"x64","arch":"x64","qt":"","generator":""},
            {"target":"x86","arch":"x64_x86","qt":"","generator":""},
            {"target":"arm64","arch":"arm64","qt":"qt6","generator":""},
            {"target":"x64_qt6","arch":"x64","qt":"qt6","generator":""},
            {"target":"x64_ninja","arch":"x64","qt":"","generator":"Ninja Multi-Config"},
            {"target":"x64_qt6_ninja","arch":"x64","qt":"qt6","generator":"Ninja Multi-Config"},
            {"target":"x86_ninja","arch":"x64_x86","qt":"","generator":"Ninja Multi-Config"},
            {"target":"arm64_ninja","arch":"arm64","qt":"qt6","generator":"Ninja Multi-Config"}
          ]'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED="${{ inputs.target }}"
            if [ "$SELECTED" = "all" ]; then
              TARGETS="$ALL_TARGETS"
            else
              case "$SELECTED" in
                x64)           TARGETS='[{"target":"x64","arch":"x64","qt":"","generator":""}]' ;;
                x86)           TARGETS='[{"target":"x86","arch":"x64_x86","qt":"","generator":""}]' ;;
                arm64)         TARGETS='[{"target":"arm64","arch":"arm64","qt":"qt6","generator":""}]' ;;
                x64_qt6)       TARGETS='[{"target":"x64_qt6","arch":"x64","qt":"qt6","generator":""}]' ;;
                x64_ninja)     TARGETS='[{"target":"x64_ninja","arch":"x64","qt":"","generator":"Ninja Multi-Config"}]' ;;
                x64_qt6_ninja) TARGETS='[{"target":"x64_qt6_ninja","arch":"x64","qt":"qt6","generator":"Ninja Multi-Config"}]' ;;
                x86_ninja)     TARGETS='[{"target":"x86_ninja","arch":"x64_x86","qt":"","generator":"Ninja Multi-Config"}]' ;;
                arm64_ninja)   TARGETS='[{"target":"arm64_ninja","arch":"arm64","qt":"qt6","generator":"Ninja Multi-Config"}]' ;;
                *)             echo "Unknown target: $SELECTED"; exit 1 ;;
              esac
            fi
          else
            TARGETS="$ALL_TARGETS"
          fi

          MATRIX=$(jq -n -c --argjson inc "$TARGETS" '{include: $inc}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows ${{ matrix.target }}
    needs: matrix-prep
    if: >
      !(github.event_name == 'push'
        && contains(github.event.head_commit.message, '[skip ci]'))
      && !(github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name)

    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    environment: "TD Build ENV"

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.matrix) }}

    env:
      UPLOAD_ARTIFACT: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifact || 'true' }}
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configure git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS Build Tools
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile vs_buildtools.exe
          $p = Start-Process -FilePath .\vs_buildtools.exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item vs_buildtools.exe -Force
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # RESTORE CACHES (WILL NOT WRITE ON WORKFLOW FINISH)
      - name: Restore ThirdParty cache
        id: restore-third-party
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Restore Libraries cache
        id: restore-libs
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-

      - name: Restore Qt cache
        id: restore-qt
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-

      # HEAVY BUILD STEP
      - name: Libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent ${{ matrix.qt }}

      - name: Free up disk space
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

      # SAVE CACHES IMMEDIATELY BEFORE ATTEMPTING BUILD
      - name: Save ThirdParty cache (Immediate)
        if: steps.restore-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save Libraries cache (Immediate)
        if: steps.restore-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-${{ env.CACHE_KEY }}

      - name: Save Qt cache (Immediate)
        if: steps.restore-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ env.CACHE_KEY }}

      - name: Check Telegram API Secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.TELEGRAM_API_ID }}" ] || [ -z "${{ secrets.TELEGRAM_API_HASH }}" ]; then
            echo "::error::Missing Telegram API credentials! Please set TELEGRAM_API_ID and TELEGRAM_API_HASH in Environment Secrets."
            exit 1
          fi

      - name: Kotatogram Desktop build
        if: env.ONLY_CACHE == 'false'
        run: |
          @echo off
          C:
          cd %userprofile%\TBuild\%REPO_NAME%\Telegram

          :: Wipe previous CMake cache to prevent configuration mismatch errors
          if exist "..\out\CMakeCache.txt" del /f /q "..\out\CMakeCache.txt"
          if exist "..\out\CMakeFiles" rmdir /s /q "..\out\CMakeFiles"

          set "GENERATOR_ARG="
          if not "${{ matrix.generator }}"=="" set "GENERATOR_ARG=-G "${{ matrix.generator }}""

          set "QT_ARG="
          if not "${{ matrix.qt }}"=="" set "QT_ARG=${{ matrix.qt }}"

          :: Run configuration step
          call configure.bat ^
          %GENERATOR_ARG% ^
          ${{ matrix.arch }} ^
          %QT_ARG% ^
          -D TDESKTOP_API_ID="${{ secrets.TELEGRAM_API_ID }}" ^
          -D TDESKTOP_API_HASH="${{ secrets.TDESKTOP_API_HASH }}" ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          if %ERRORLEVEL% NEQ 0 (
            echo ::error::CMake configuration failed!
            exit /b %ERRORLEVEL%
          )

          :: Build project
          cmake --build ..\out --config Debug --parallel

      - name: Move artifact
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Debug
          mkdir artifact
          if exist "%OUT%\Kotatogram.exe" copy "%OUT%\Kotatogram.exe" artifact\
          if exist "%OUT%\Updater.exe" copy "%OUT%\Updater.exe" artifact\

      - name: Upload artifact
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        uses: actions/upload-artifact@v4
        with:
          name: Kotatogram-${{ matrix.target }}
          path: artifact\
